<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempest · Weather</title>
<style nonce="{{NONCE}}">
:root{color-scheme:dark;--bg:#17232e;--ink:#eff7fb;--accent:#72dac5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:30px 24px 60px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:38px}a,button{color:inherit;background:#ffffff0d;border:1px solid #ffffff30;border-radius:12px;padding:10px 15px;text-decoration:none;font:inherit;cursor:pointer}a:hover,button:hover{background:#ffffff20}a:focus-visible,button:focus-visible{outline:3px solid var(--accent)}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:12px;letter-spacing:2px;font-weight:700}h1{font-size:clamp(28px,4vw,46px);margin:8px 0 10px;letter-spacing:-1px}header p{opacity:.7;margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.tile{padding:24px;background:#ffffff08;border:1px solid #ffffff22;border-radius:20px;min-width:0;box-shadow:0 14px 40px #0000000a}.tile h2{font-size:14px;margin:0;opacity:.75;font-weight:500}.value{font-size:clamp(24px,var(--value-size,3vw),64px);letter-spacing:-1px;margin:16px 0 5px;font-weight:600;overflow-wrap:anywhere}.meta{font-size:12px;opacity:.65}.stale{color:#ffd48b;opacity:1}.chart{width:100%;height:86px;margin-top:18px;display:block}.plot{padding:0;border:0;background:none;display:block;width:100%;text-align:left}.plot:hover{background:none}.chart-label{font-size:11px;opacity:.6;display:block;margin-top:5px}.notice{padding:14px 18px;border:1px solid #ffffff33;border-radius:12px;margin:20px 0;line-height:1.5}.notice:empty{display:none}dialog{width:min(850px,95vw);border:1px solid #ffffff40;border-radius:20px;background:#17232e;color:#eff7fb;padding:25px}dialog::backdrop{background:#000a}dialog canvas{width:100%;height:280px}dialog header{display:flex;justify-content:space-between;gap:15px;align-items:center}dialog h2{font-size:20px}.tooltip{font-size:14px;min-height:24px;color:var(--accent)}footer{margin-top:26px;font-size:12px;opacity:.6}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){main{padding:20px 15px 40px}nav{margin-bottom:26px}.grid{gap:12px}.tile{padding:17px}.value{font-size:26px}nav a{font-size:14px;padding:9px 12px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head><body><main><nav id="nav" aria-label="Navigation"></nav><header><div class="eyebrow">Weatherflow · Tempest</div><h1 id="station">Your weather, at a glance</h1><p>Live observations from your weather station.</p></header><div id="notice" class="notice" role="status" aria-live="polite"></div><a id="signin" hidden>Sign in with passkey</a><section id="tiles" class="grid" aria-label="Weather observations"></section><footer id="updated">Connecting to your station…</footer></main><dialog id="detail"><header><h2 id="detail-title">Weather history</h2><button id="close" aria-label="Close chart">Close</button></header><canvas id="detail-chart" aria-label="Weather history chart"></canvas><p id="tooltip" class="tooltip" aria-live="polite"></p><p id="chart-note" class="meta"></p></dialog>
<script nonce="{{NONCE}}">
'use strict';const $=id=>document.getElementById(id);let reading=false,revision='',rows=[],timer,active=null,presentation={},chartCache=new Map(),drawing=[];const endpoint=(action,extra={})=>{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('action',action);for(const [k,v]of Object.entries(extra))u.searchParams.set(k,v);return u};
async function request(action,extra){const r=await fetch(endpoint(action,extra),{signal:AbortSignal.timeout(90000),credentials:'same-origin'}),data=await r.json();if(!r.ok){if(r.status===401&&data.login){$('signin').href=data.login;$('signin').hidden=false;clearTimeout(timer)}throw Error(data.error||'Weather is temporarily unavailable.')}return data}
function navigation(links){$('nav').replaceChildren();for(const [key,label]of [['weather','Weather'],['admin','Administration'],['portal','Portal'],['documentation','Dokumentation']])if(links[key]){const a=document.createElement('a');a.textContent=label;a.href=links[key];if(key==='weather')a.setAttribute('aria-current','page');$('nav').append(a)}}
const hex=n=>'#'+Number(n).toString(16).padStart(6,'0');function time(t){return new Intl.DateTimeFormat(undefined,{dateStyle:'short',timeStyle:'short',timeZone:presentation.HTMLTimezone||'UTC'}).format(new Date(t*1000))}
function plot(canvas,points,large=false){const box=canvas.getBoundingClientRect(),w=Math.max(1,box.width),h=large?280:Math.max(35,presentation.HTMLChartHeight||86),dpr=devicePixelRatio||1;canvas.style.height=h+'px';canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);const pad=large?28:5;if(!points.length){c.fillStyle='#9caeb7';c.font='12px system-ui';c.fillText('No archived observations',pad,Math.min(h-5,24));return []}const values=points.map(p=>p[1]),min=Math.min(...values),max=Math.max(...values),span=max-min||1,start=points[0][0],end=points.at(-1)[0],xy=points.map(([t,v])=>[pad+(t-start)/(end-start||1)*(w-2*pad),h-pad-(v-min)/span*(h-2*pad)]);c.strokeStyle=hex(presentation.ChartColor??7527109);c.lineWidth=2;c.beginPath();xy.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();if(points.length===1){c.beginPath();c.arc(xy[0][0],xy[0][1],3,0,Math.PI*2);c.fillStyle=c.strokeStyle;c.fill()}if(large){c.font='11px system-ui';c.fillStyle='#afbdc8';c.fillText(max.toFixed(2),2,13);c.fillText(min.toFixed(2),2,h-2)}return xy}
async function history(row){const key=row.ident+':'+presentation.ChartTimeframe,old=chartCache.get(key);if(old&&Date.now()-old.at<300000)return old.data;const data=await request('history',{ident:row.ident});chartCache.set(key,{at:Date.now(),data});return data}
function render(){const grid=$('tiles');grid.replaceChildren();if(!$('notice').textContent&&rows.length===0)$('notice').textContent='No dashboard variables are selected. Choose observations in Administration.';for(const row of rows){const card=document.createElement('article');card.className='tile';const h=document.createElement('h2');h.textContent=row.label;const value=document.createElement('div');value.className='value';value.textContent=row.value===null?'—':row.formatted;const meta=document.createElement('div');meta.className='meta'+(row.status==='stale'?' stale':'');meta.textContent=row.updated?(row.status==='stale'?'Stale · ':'Updated ')+time(row.updated):'Unavailable · waiting for station data';card.append(h,value,meta);if(row.chart){const b=document.createElement('button');b.className='plot';b.setAttribute('aria-label','Open history: '+row.label);const canvas=document.createElement('canvas');canvas.className='chart';const caption=document.createElement('span');caption.className='chart-label';caption.textContent=(presentation.ChartTimeframe||24)+' hours · hourly averages · expand';b.append(canvas,caption);b.onclick=()=>openChart(row);card.append(b);history(row).then(data=>{if(canvas.isConnected)plot(canvas,data.points)}).catch(e=>{caption.textContent=e.message})}grid.append(card)}}
async function openChart(row){active=row;$('detail-title').textContent=row.label;$('tooltip').textContent='Loading archived observations…';$('detail').showModal();try{const data=await history(row);if(active!==row)return;drawing=plot($('detail-chart'),data.points,true);active={...row,data};$('tooltip').textContent=data.points.length?'Move across the chart to inspect a value.':'No observations in this time window.';$('chart-note').textContent='Hourly averages · '+time(data.from)+' – '+time(data.to)+' · '+(presentation.HTMLTimezone||'UTC')}catch(e){$('tooltip').textContent=e.message}}
$('detail-chart').addEventListener('pointermove',e=>{if(!active?.data?.points.length)return;const x=e.clientX-e.currentTarget.getBoundingClientRect().left;let nearest=0;drawing.forEach((p,i)=>{if(Math.abs(p[0]-x)<Math.abs(drawing[nearest][0]-x))nearest=i});const p=active.data.points[nearest];$('tooltip').textContent=time(p[0])+' · '+p[1].toLocaleString(undefined,{maximumFractionDigits:3})});$('close').onclick=()=>{$('detail').close();active=null};$('detail').addEventListener('close',()=>active=null);
async function refresh(){clearTimeout(timer);if(reading||document.hidden)return;reading=true;let poll=10;try{const data=await request('data',{revision});revision=data.revision;poll=data.poll;presentation=data.presentation||{};document.documentElement.style.setProperty('--bg',hex(presentation.HTMLBackgroundColor??1516334));document.documentElement.style.setProperty('--ink',hex(presentation.HTMLFontColor??15726587));document.documentElement.style.setProperty('--value-size',(presentation.HTMLFontSizeValue||4.5)+'vw');$('station').textContent=data.station;navigation(data.navigation);$('notice').textContent=data.enabled?'':'The weather dashboard is disabled in this instance.';if(data.changed){rows=data.enabled?data.values||[]:[];render()}$('updated').textContent='Connected · checked '+time(data.now)+' · charts refresh at most every five minutes';$('signin').hidden=true}catch(e){$('notice').textContent=e.message;poll=30}reading=false;if(document.hidden||!$('signin').hidden)return;timer=setTimeout(refresh,Math.max(2,poll)*1000)}document.addEventListener('visibilitychange',()=>document.hidden?clearTimeout(timer):refresh());let resize;window.addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(()=>{render();if(active?.data)drawing=plot($('detail-chart'),active.data.points,true)},200)});refresh();
</script></body></html>
