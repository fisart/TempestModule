<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempest · Weather</title>
<style nonce="{{NONCE}}">
:root{color-scheme:dark;--bg:#17232e;--ink:#eff7fb;--accent:#72dac5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:30px 24px 60px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:38px}a,button{color:inherit;background:#ffffff0d;border:1px solid #ffffff30;border-radius:12px;padding:10px 15px;text-decoration:none;font:inherit;cursor:pointer}a:hover,button:hover{background:#ffffff20}a:focus-visible,button:focus-visible{outline:3px solid var(--accent)}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:12px;letter-spacing:2px;font-weight:700}h1{font-size:clamp(28px,4vw,46px);margin:8px 0 10px;letter-spacing:-1px}header p{opacity:.7;margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.tile{padding:24px;background:#ffffff08;border:1px solid #ffffff22;border-radius:20px;min-width:0;box-shadow:0 14px 40px #0000000a}.tile h2{font-size:14px;margin:0;opacity:.75;font-weight:500}.value{font-size:clamp(24px,var(--value-size,3vw),64px);letter-spacing:-1px;margin:16px 0 5px;font-weight:600;overflow-wrap:anywhere}.meta{font-size:12px;opacity:.65}.stale{color:#ffd48b;opacity:1}.chart{width:100%;height:86px;margin-top:18px;display:block}.plot{padding:0;border:0;background:none;display:block;width:100%;text-align:left}.plot:hover{background:none}.chart-label{font-size:11px;opacity:.6;display:block;margin-top:5px}.notice{padding:14px 18px;border:1px solid #ffffff33;border-radius:12px;margin:20px 0;line-height:1.5}.notice:empty{display:none}dialog{width:min(850px,95vw);border:1px solid #ffffff40;border-radius:20px;background:#17232e;color:#eff7fb;padding:25px}dialog::backdrop{background:#000a}dialog canvas{width:100%;height:280px}dialog header{display:flex;justify-content:space-between;gap:15px;align-items:center}dialog h2{font-size:20px}.tooltip{font-size:14px;min-height:24px;color:var(--accent)}footer{margin-top:26px;font-size:12px;opacity:.6}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){main{padding:20px 15px 40px}nav{margin-bottom:26px}.grid{gap:12px}.tile{padding:17px}.value{font-size:26px}nav a{font-size:14px;padding:9px 12px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin:0 0 25px;padding:5px;background:#ffffff08;border:1px solid #ffffff22;border-radius:15px;width:fit-content;max-width:100%}.tabs button{border-color:transparent;background:transparent;white-space:nowrap}.tabs button[aria-selected=true]{background:var(--accent);color:#102b2b;font-weight:700}.forecast{background:#fff;border-radius:18px;overflow:hidden;color:#173747}.forecast-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;flex-wrap:wrap}.forecast-head p{margin:4px 0;font-size:13px}.forecast button{color:#173747;border-color:#bbcbd3}.forecast img{display:block;width:100%;height:auto}.forecast[hidden],.grid[hidden]{display:none}#forecast-large{width:min(1500px,98vw);height:95vh;max-width:98vw}#forecast-scroll{height:calc(100% - 75px);overflow:auto;background:white;border-radius:10px}#forecast-large img{display:block;width:100%;height:auto}#forecast-scroll.zoomed img{width:1800px;max-width:none}@media(max-width:550px){.tabs{width:100%;gap:0}.tabs button{padding:11px 8px;flex:1;font-size:13px}.forecast-head{padding:15px}#forecast-large{padding:15px}#forecast-large h2{font-size:16px}}
</style></head><body><main><nav id="nav" aria-label="Navigation"></nav><header><div class="eyebrow">Weatherflow · Tempest</div><h1 id="station">Your weather, at a glance</h1><p id="subtitle">Live observations from your weather station.</p></header><div class="tabs" role="tablist" aria-label="Weather location"><button id="tab-berlin" role="tab" aria-selected="true" aria-controls="tiles" tabindex="0" data-view="berlin">Berlin</button><button id="tab-hermitage" role="tab" aria-selected="false" aria-controls="tiles" tabindex="-1" data-view="hermitage">Hermitage</button><button id="tab-forecast" role="tab" aria-selected="false" aria-controls="forecast" tabindex="-1" data-view="forecast">Berlin forecast</button></div><div id="notice" class="notice" role="status" aria-live="polite"></div><a id="signin" hidden>Sign in with passkey</a><section id="tiles" class="grid" role="tabpanel" aria-labelledby="tab-berlin"></section><section id="forecast" class="forecast" role="tabpanel" aria-labelledby="tab-forecast" hidden><div class="forecast-head"><div><strong id="forecast-title">Berlin-Dahlem forecast</strong><p id="forecast-meta"></p></div><button id="expand-forecast" disabled>Enlarge forecast</button></div><img id="forecast-image" alt="Berlin weather forecast chart" hidden></section><footer id="updated">Connecting to your station…</footer></main><dialog id="detail"><header><h2 id="detail-title">Weather history</h2><button id="close" aria-label="Close chart">Close</button></header><canvas id="detail-chart" aria-label="Weather history chart"></canvas><p id="tooltip" class="tooltip" aria-live="polite"></p><p id="chart-note" class="meta"></p></dialog>
<dialog id="forecast-large"><header><h2>Berlin weather forecast</h2><div><button id="zoom-forecast">Zoom in</button> <button id="close-forecast" aria-label="Close forecast">Close</button></div></header><div id="forecast-scroll"><img id="forecast-full" alt="Enlarged Berlin forecast chart"></div></dialog><script nonce="{{NONCE}}">
'use strict';const $=id=>document.getElementById(id);let revision='',rows=[],timer,active=null,presentation={},chartCache=new Map(),drawing=[],generation=0,forecastRevision='',defaultLoaded=false;
const views=['berlin','hermitage','forecast'],storageKey='tempest.view:'+location.pathname;let remembered='';try{remembered=localStorage.getItem(storageKey)||''}catch(e){}const initialHash=location.hash.slice(1);let view=views.includes(initialHash)?initialHash:views.includes(remembered)?remembered:'berlin';const hasPreference=views.includes(initialHash)||views.includes(remembered);const endpoint=(action,extra={})=>{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('action',action);for(const [k,v]of Object.entries(extra))u.searchParams.set(k,v);return u};
async function request(action,extra){const r=await fetch(endpoint(action,extra),{signal:AbortSignal.timeout(90000),credentials:'same-origin'}),data=await r.json();if(!r.ok){if(r.status===401&&data.login){$('signin').href=data.login;$('signin').hidden=false;clearTimeout(timer)}throw Error(data.error||'Weather is temporarily unavailable.')}return data}
function navigation(links){$('nav').replaceChildren();for(const [key,label]of [['weather','Weather'],['admin','Administration'],['portal','Portal'],['documentation','Dokumentation']])if(links[key]){const a=document.createElement('a');a.textContent=label;a.href=links[key];if(key==='weather')a.setAttribute('aria-current','page');$('nav').append(a)}}
const hex=n=>'#'+Number(n).toString(16).padStart(6,'0');function time(t){return new Intl.DateTimeFormat(undefined,{dateStyle:'short',timeStyle:'short',timeZone:presentation.HTMLTimezone||'UTC'}).format(new Date(t*1000))}
function plot(canvas,points,large=false){const box=canvas.getBoundingClientRect(),w=Math.max(1,box.width),h=large?280:Math.max(35,presentation.HTMLChartHeight||86),dpr=devicePixelRatio||1;canvas.style.height=h+'px';canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,w,h);const pad=large?28:5;if(!points.length){c.fillStyle='#9caeb7';c.font='12px system-ui';c.fillText('No archived observations',pad,Math.min(h-5,24));return []}const values=points.map(p=>p[1]),min=Math.min(...values),max=Math.max(...values),span=max-min||1,start=points[0][0],end=points.at(-1)[0],xy=points.map(([t,v])=>[pad+(t-start)/(end-start||1)*(w-2*pad),h-pad-(v-min)/span*(h-2*pad)]);c.strokeStyle=hex(presentation.ChartColor??7527109);c.lineWidth=2;c.beginPath();xy.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();if(points.length===1){c.beginPath();c.arc(xy[0][0],xy[0][1],3,0,Math.PI*2);c.fillStyle=c.strokeStyle;c.fill()}if(large){c.font='11px system-ui';c.fillStyle='#afbdc8';c.fillText(max.toFixed(2),2,13);c.fillText(min.toFixed(2),2,h-2)}return xy}
async function loadHistory(row){const source=view,key=source+':'+row.ident+':'+presentation.ChartTimeframe,old=chartCache.get(key);if(old&&Date.now()-old.at<300000)return old.data;const data=await request('history',{ident:row.ident,view:source});chartCache.set(key,{at:Date.now(),data});return data}
function render(){const grid=$('tiles');grid.replaceChildren();if(!$('notice').textContent&&rows.length===0)$('notice').textContent='No dashboard variables are selected. Choose observations in Administration.';for(const row of rows){const card=document.createElement('article');card.className='tile';const h=document.createElement('h2');h.textContent=row.label;const value=document.createElement('div');value.className='value';value.textContent=row.value===null?'—':row.formatted;const meta=document.createElement('div');meta.className='meta'+(row.status==='stale'?' stale':'');meta.textContent=row.updated?(row.status==='stale'?'Stale · ':'Updated ')+time(row.updated):'Unavailable · waiting for station data';card.append(h,value,meta);if(row.chart){const b=document.createElement('button');b.className='plot';b.setAttribute('aria-label','Open history: '+row.label);const canvas=document.createElement('canvas');canvas.className='chart';const caption=document.createElement('span');caption.className='chart-label';caption.textContent=(presentation.ChartTimeframe||24)+' hours · hourly averages · expand';b.append(canvas,caption);b.onclick=()=>openChart(row);card.append(b);loadHistory(row).then(data=>{if(canvas.isConnected)plot(canvas,data.points)}).catch(e=>{caption.textContent=e.message})}grid.append(card)}}
async function openChart(row){const epoch=generation;active=row;$('detail-title').textContent=row.label;$('tooltip').textContent='Loading archived observations…';$('detail').showModal();try{const data=await loadHistory(row);if(epoch!==generation||active!==row)return;drawing=plot($('detail-chart'),data.points,true);active={...row,data};$('tooltip').textContent=data.points.length?'Move across the chart to inspect a value.':'No observations in this time window.';$('chart-note').textContent='Hourly averages · '+time(data.from)+' – '+time(data.to)+' · '+(presentation.HTMLTimezone||'UTC')}catch(e){$('tooltip').textContent=e.message}}
$('detail-chart').addEventListener('pointermove',e=>{if(!active?.data?.points.length)return;const x=e.clientX-e.currentTarget.getBoundingClientRect().left;let nearest=0;drawing.forEach((p,i)=>{if(Math.abs(p[0]-x)<Math.abs(drawing[nearest][0]-x))nearest=i});const p=active.data.points[nearest];$('tooltip').textContent=time(p[0])+' · '+p[1].toLocaleString(undefined,{maximumFractionDigits:3})});$('close').onclick=()=>{$('detail').close();active=null};$('detail').addEventListener('close',()=>active=null);
function showTab(){
 for(const key of views){const button=$('tab-'+key),selected=key===view;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1}
 $('tiles').hidden=view==='forecast';$('tiles').setAttribute('aria-labelledby','tab-'+view);$('forecast').hidden=view!=='forecast';
 $('station').textContent=view==='hermitage'?'Hermitage':view==='forecast'?'Berlin forecast':'Berlin';
 $('subtitle').textContent=view==='forecast'?'The downloaded Berlin-Dahlem forecast · DWD / profiwetter.ch':view==='hermitage'?'Live observations from the Hermitage mirror.':'Live observations from your Berlin weather station.';
}
function selectView(next,save=true){
 if(!views.includes(next))return;view=next;generation++;revision='';rows=[];clearTimeout(timer);$('tiles').replaceChildren();$('notice').textContent='';$('updated').textContent='Connecting…';$('detail').close();active=null;$('forecast-large').close();showTab();
 if(save){try{localStorage.setItem(storageKey,view)}catch(e){}historyReplace(view)}refresh();
}
function historyReplace(key){window.history.replaceState(null,'','#'+key)}
for(const key of views){const button=$('tab-'+key);button.onclick=()=>selectView(key);button.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const index=e.key==='Home'?0:e.key==='End'?2:(views.indexOf(view)+(e.key==='ArrowRight'?1:2))%3;selectView(views[index]);$('tab-'+view).focus()}}}
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(views.includes(next)&&next!==view)selectView(next)});
function showForecast(data){
 const f=data.forecast||{};$('expand-forecast').disabled=!f.available;
 if(!f.available){$('forecast-image').hidden=true;$('forecast-image').removeAttribute('src');$('forecast-full').removeAttribute('src');forecastRevision='';$('forecast-meta').textContent=f.error||'Forecast unavailable.';return}
 $('forecast-title').textContent=f.title;$('forecast-meta').textContent=(f.stale?'Stale · ':'Updated ')+time(f.updated)+' · '+f.credit;
 if(f.revision!==forecastRevision){forecastRevision=f.revision;const image=endpoint('forecast-image',{revision:f.revision});$('forecast-image').src=image;$('forecast-full').removeAttribute('src')}$('forecast-image').hidden=false;
 if(f.stale)$('notice').textContent='The forecast image has not been updated for more than 24 hours.';
}
$('forecast-image').onerror=()=>{$('notice').textContent='The forecast image could not be loaded. Refresh or check its source in Administration.';$('expand-forecast').disabled=true;forecastRevision=''};
$('expand-forecast').onclick=()=>{$('forecast-full').src=$('forecast-image').src;$('forecast-scroll').classList.remove('zoomed');$('zoom-forecast').textContent='Zoom in';$('forecast-large').showModal()};$('close-forecast').onclick=()=>$('forecast-large').close();$('zoom-forecast').onclick=()=>{const zoom=$('forecast-scroll').classList.toggle('zoomed');$('zoom-forecast').textContent=zoom?'Fit to window':'Zoom in'};
async function refresh(){
 clearTimeout(timer);if(document.hidden)return;const epoch=generation,selected=view;let poll=10;
 try{
  const data=await request('data',{revision,view:selected});if(epoch!==generation)return;
  if(!defaultLoaded){defaultLoaded=true;if(!hasPreference&&views.includes(data.defaultView)&&data.defaultView!==view){selectView(data.defaultView,false);return}}
  revision=data.revision;poll=data.poll;presentation=data.presentation||{};
  document.documentElement.style.setProperty('--bg',hex(presentation.HTMLBackgroundColor??1516334));document.documentElement.style.setProperty('--ink',hex(presentation.HTMLFontColor??15726587));document.documentElement.style.setProperty('--value-size',(presentation.HTMLFontSizeValue||4.5)+'vw');navigation(data.navigation);
  $('notice').textContent=data.enabled?'':'The weather dashboard is disabled in this instance.';
  if(view==='forecast'){if(data.enabled)showForecast(data);$('forecast').hidden=!data.enabled}
  else if(data.changed){rows=data.enabled?data.values||[]:[];render()}
  $('updated').textContent='Connected · checked '+time(data.now)+' · '+(view==='forecast'?'image reloads only when changed':'charts refresh at most every five minutes · '+(presentation.HTMLTimezone||'UTC'));$('signin').hidden=true;
 }catch(e){if(epoch!==generation)return;$('notice').textContent=e.message;poll=30}
 if(epoch===generation&&!document.hidden&&$('signin').hidden)timer=setTimeout(refresh,Math.max(2,poll)*1000);
}
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);generation++;if(!document.hidden)refresh()});let resize;window.addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(()=>{if(view!=='forecast')render();if(active?.data)drawing=plot($('detail-chart'),active.data.points,true)},200)});showTab();refresh();
</script></body></html>
